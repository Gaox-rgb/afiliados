<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil de Empresa - Makumoto®</title><link rel="icon" type="image/png" href="imagenes/logo.png"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>@import url(https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap);:root{--color-primary:#FFD700;--color-secondary:#ff4d4d;--color-dark:#101010;--color-light-dark:#1E1E1E;--color-text:#E0E0E0;--color-text-dark:#333;--font-family:'Poppins',sans-serif}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:var(--font-family);background-color:var(--color-dark);color:var(--color-text);line-height:1.6}.container{max-width:900px;margin:0 auto;padding:0 20px}section{padding:60px 0;text-align:center}#main-header{background:var(--color-dark);padding:15px 0;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:1000}.header-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:15px}.header-top{display:flex;justify-content:space-between;align-items:center;width:100%}.header-bottom{display:flex;justify-content:center;align-items:center;gap:15px}.logo{display:flex;align-items:center;gap:10px;color:var(--color-primary);font-weight:700;text-decoration:none;display:flex;align-items:center;gap:12px}.logo img{height:30px}.logo-text-group{display:flex;flex-direction:column;align-items:center;line-height:1}.afiliados-tag{font-size:.55rem;letter-spacing:3px;margin-top:3px;color:var(--color-text);font-weight:900}.shine-effect{position:relative;overflow:hidden;display:inline-block}.shine-effect::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:4s 2s infinite shine}@keyframes shine{0%{transform:translateX(0)}100%{transform:translateX(200%)}}.header-actions{display:flex;align-items:center;gap:15px}.cta-button-header{background:var(--color-primary);color:var(--color-dark);padding:8px 16px;border-radius:5px;text-decoration:none;font-weight:700}.login-button-header{background:0 0;color:var(--color-primary);border:1px solid var(--color-primary);padding:4px 8px;border-radius:4px;cursor:pointer;font-weight:700;text-decoration:none;transition:.2s;font-size:.65rem;text-transform:uppercase;white-space:nowrap}.login-button-header:hover{background-color:var(--color-primary);color:var(--color-dark)}.btn-plus{border-color:#00ecff;color:#00ecff}.btn-plus:hover{background-color:#00ecff;color:var(--color-dark)}#main-footer{background-color:#0a0a0a;padding:30px 0;text-align:center;border-top:1px solid #2a2a2a;font-size:.9rem;color:#888}.error-text,.loader-text{font-size:1.5rem;text-align:center;padding:40px 0}.loader-text{color:var(--color-primary)}.error-text{color:var(--color-secondary)}#profile-content{background-color:var(--color-light-dark);border-radius:10px;border:1px solid #333;padding:30px;text-align:left;display:none}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(18,18,18,.95);display:flex;justify-content:center;align-items:center;z-index:2000;opacity:0;transition:opacity .3s;visibility:hidden}.modal-overlay.visible{opacity:1;visibility:visible}#login-form{display:flex;flex-direction:column;gap:15px;margin-top:20px}#login-form input{padding:12px;border-radius:5px;border:1px solid #444;background:#fff;color:var(--color-text-dark);font-size:1rem}#login-form button{background:var(--color-primary);color:var(--color-dark);border:none;padding:12px;border-radius:5px;font-weight:700;cursor:pointer;font-size:1.1rem}.profile-header{display:flex;flex-direction:column;align-items:center;gap:20px;margin-bottom:30px;text-align:center}#company-logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--color-primary)}.profile-title h1{font-size:2.5rem;font-weight:900;color:var(--color-primary);margin:0}.profile-title p{font-size:1.2rem;opacity:.8;margin-top:5px}.profile-body{border-top:1px solid #444;padding-top:30px}.profile-section h3{font-size:1.5rem;color:var(--color-primary);margin-bottom:10px;border-bottom:2px solid var(--color-primary);padding-bottom:5px;display:inline-block}#company-description{font-size:1rem;line-height:1.8;white-space:pre-wrap}.profile-contact{margin-top:30px}.contact-item{display:flex;align-items:center;gap:15px;margin-bottom:15px;font-size:1.1rem}.contact-item i{color:var(--color-primary);width:20px;text-align:center}.contact-item a{color:var(--color-text);text-decoration:none;transition:color .2s}.contact-item a:hover{color:var(--color-primary)}</style></head><body><header id="main-header"></header><main><section id="profile-section"><div class="container"><div id="loader"><p class="loader-text"><i class="fas fa-spinner fa-spin"></i> Cargando perfil...</p></div><div id="profile-content"><header class="profile-header"><img src="https://placehold.co/150x150" alt="Logo de la empresa" id="company-logo"><div class="profile-title"><h1 id="company-name">[Nombre de la Empresa]</h1><p id="company-tagline">[Eslogan de la empresa]</p></div></header><div class="profile-body"><div class="profile-section"><h3>Sobre Nosotros</h3><p id="company-description">[Descripción detallada de la empresa...]</p></div><div class="profile-section profile-contact"><h3>Contacto</h3><div id="contact-info"></div></div></div></div></div></section></main><footer id="main-footer"><div class="container"><p>&copy; 2024 Makumoto®. Todos los derechos reservados.</p></div></footer><div id="login-modal" class="modal-overlay"><div class="modal-content" style="background:#1e1e1e;padding:40px;border-radius:10px;text-align:center;position:relative;max-width:500px;border-top:5px solid gold"><span class="modal-close-btn" id="close-login-modal" style="position:absolute;top:10px;right:15px;background:0 0;border:none;color:#e0e0e0;font-size:2rem;cursor:pointer">&times;</span><h3 style="font-size:1.8rem;color:gold;margin-bottom:10px">Acceso de Gerente</h3><p style="margin-bottom:25px;font-size:1.1rem">Ingresa tus credenciales para acceder a tu dashboard.</p><form id="login-form"><input id="login-convenio" placeholder="CÓDIGO DE CONVENIO" required style="text-transform:uppercase;width:100%;padding:12px;margin-bottom:15px;border-radius:5px;border:1px solid #444;background:#fff;color:#333"><div style="position:relative;width:100%;margin-bottom:15px"><input type="password" id="login-password" placeholder="CONTRASEÑA" required style="width:100%;padding:12px;border-radius:5px;border:1px solid #444;background:#fff;color:#333;padding-right:40px"> <span class="toggle-password" onclick='window.togglePasswordVisibility("login-password",this)' style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#888;font-size:1.1rem"><i class="fas fa-eye"></i></span></div><button type="submit">Ingresar al Centro de Mando</button></form></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/company-profile.js"></script></body></html>
