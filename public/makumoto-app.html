<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Makumoto Arsenal Plus</title><link rel="icon" type="image/png" href="imagenes/logo.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script>"true"!==sessionStorage.getItem("arsenal_access")&&window.location.replace("gana-dinero.html")</script><style>@import url(https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap);:root{--color-accent:#00ecff;--color-dark:#000;--color-card:#1c1c1e}body{background:var(--color-dark);color:#fff;font-family:Poppins,sans-serif;margin:0;padding:20px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}#skeleton-loader{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}.sk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:40px}.sk-box{width:65px;height:65px;background:#1c1c1e;border-radius:18px;animation:1.5s infinite pulse}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}.app-header{text-align:center;margin-bottom:30px;position:relative;padding-top:10px}.app-header img{width:45px;margin-bottom:5px}.app-header h2{font-size:.8rem;color:var(--color-accent);letter-spacing:3px;font-weight:900;margin:0;text-transform:uppercase}.back-btn{position:absolute;left:10px;top:15px;font-size:1.3rem;color:#fff;cursor:pointer;opacity:.6}.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;max-width:500px;margin:0 auto;padding-bottom:100px}.app-icon{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-decoration:none;color:#fff;transition:transform .1s}.app-icon:active{transform:scale(.9)}.icon-box{width:65px;height:65px;background:var(--color-card);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin-bottom:6px;border:1px solid #333;transition:.2s}.app-icon span{font-size:.6rem;font-weight:600;text-align:center;opacity:.7;text-transform:uppercase}.tool-view{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);backdrop-filter:blur(15px);z-index:5000;display:none;padding:40px 20px;box-sizing:border-box}.tool-view.active{display:flex;flex-direction:column}.view-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;padding-bottom:15px;margin-bottom:20px}.view-header h3{margin:0;color:var(--color-accent);font-weight:900;text-transform:uppercase;font-size:1.1rem}.close-view-btn{font-size:2rem;color:#fff;cursor:pointer;opacity:.6}.content-card{background:#111;padding:20px;border-radius:15px;border:1px solid #222;margin-bottom:15px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#000;color:#fff;margin:10px 0;box-sizing:border-box;font-family:inherit}.btn-action{background:var(--color-accent);color:#000;border:none;padding:15px;width:100%;border-radius:10px;font-weight:900;cursor:pointer;text-transform:uppercase}</style></head><body><div id="skeleton-loader"><img src="imagenes/logo.png" width="50" style="margin-bottom:20px"><div class="sk-grid"><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div><div class="sk-box"></div></div></div><div class="app-header"><i class="fas fa-chevron-left back-btn" onclick="exitArsenal()"></i> <img src="imagenes/logo.png" alt="Makumoto Logo"><h2>Arsenal Digital</h2></div><div class="app-grid" id="main-grid"></div><div id="tool-master-view" class="tool-view"><div class="view-header"><h3 id="view-title">Función</h3><span class="close-view-btn" onclick="closeView()">&times;</span></div><div id="view-body" style="overflow-y:auto;flex-grow:1"></div></div><script src="js/app.tools.js"></script><script>const tools=[{n:"Mensajes",i:"fa-comment-dots",f:"showMessages"},{n:"Calorías",i:"fa-utensils",f:"showCalories"},{n:"Manual",i:"fa-first-aid",f:"showManual"},{n:"Scanner",i:"fa-barcode",f:"showScanner"},{n:"Linterna",i:"fa-bolt",f:"doFlash"},{n:"Ayuno",i:"fa-clock",f:"generic"},{n:"Ganancias",i:"fa-dollar-sign",f:"generic"},{n:"Gratitud",i:"fa-heart",f:"generic"},{n:"Agua",i:"fa-tint",f:"generic"},{n:"Postura",i:"fa-child",f:"generic"},{n:"Pomodoro",i:"fa-stopwatch",f:"generic"},{n:"Pasos",i:"fa-shoe-prints",f:"generic"},{n:"Recetas",i:"fa-book-open",f:"generic"},{n:"Luz Azul",i:"fa-eye",f:"generic"},{n:"Respirar",i:"fa-wind",f:"generic"},{n:"Mercados",i:"fa-chart-line",f:"generic"},{n:"Gastos",i:"fa-wallet",f:"generic"},{n:"Rutinas",i:"fa-dumbbell",f:"generic"},{n:"Sueño",i:"fa-moon",f:"generic"},{n:"Sonidos",i:"fa-volume-up",f:"generic"},{n:"Grasa",i:"fa-percentage",f:"generic"},{n:"Pánico",i:"fa-exclamation-triangle",f:"doPanic"},{n:"Training",i:"fa-running",f:"generic"},{n:"Hábitos",i:"fa-check-double",f:"generic"},{n:"GPS",i:"fa-map-marker-alt",f:"generic"}],grid=document.getElementById("main-grid");grid.innerHTML=tools.map(n=>`\n        <div class="app-icon" onclick="executeTool('${n.f}', '${n.n}')">\n            <div class="icon-box"><i class="fas ${n.i}"></i></div>\n            <span>${n.n}</span>\n        </div>\n    `).join("");const masterView=document.getElementById("tool-master-view"),viewBody=document.getElementById("view-body");function executeTool(n,e){window.app.tools.vibrate(),document.getElementById("view-title").innerText=e,viewBody.innerHTML="","generic"===n?showGeneric():window[n](),masterView.classList.add("active"),document.body.style.overflow="hidden"}function closeView(){masterView.classList.remove("active"),document.body.style.overflow="auto"}function exitArsenal(){window.app.tools.logout()}function showCalories(){viewBody.innerHTML='\n            <div class="content-card">\n                <p style="font-size:0.8rem; opacity:0.6; margin-bottom:10px;">BUSCADOR ZERO-LATENCY</p>\n                <input type="text" placeholder="Ej: Pollo, Huevo..." oninput="handleSearch(this.value)">\n                <div id="results-area" style="margin-top:15px"></div>\n            </div>'}function doFlash(){window.app.tools.flashlight.toggle().then(n=>{viewBody.innerHTML=`\n                <div class="content-card" style="text-align:center; padding:50px 20px;">\n                    <i class="fas fa-bolt fa-4x" style="color:${n?"var(--color-accent)":"#444"}"></i>\n                    <h2 style="margin-top:20px">${n?"LINTERNA ACTIVADA":"LINTERNA APAGADA"}</h2>\n                    <button class="btn-action" onclick="doFlash()" style="margin-top:20px">INTERRUPTOR</button>\n                </div>`})}function showManual(){const n=window.app.tools.data.emergency;viewBody.innerHTML=Object.keys(n).map(e=>`\n            <div class="content-card">\n                <h4 style="margin:0; color:var(--color-accent); text-transform:uppercase;">${e}</h4>\n                <p style="font-size:0.85rem; margin:10px 0 0 0; line-height:1.4;">${n[e]}</p>\n            </div>\n        `).join("")}function showMessages(){viewBody.innerHTML='\n            <div class="content-card" style="text-align:center;">\n                <i class="fas fa-bell fa-2x" style="color:var(--color-accent); margin-bottom:15px;"></i>\n                <p>Las alertas de disciplina se envían automáticamente a tu centro de notificaciones.</p>\n                <button class="btn-action" onclick="window.app.tools.sendDailyNotification()" style="margin-top:15px;">PROBAR NOTIFICACIÓN</button>\n            </div>'}function showGeneric(){viewBody.innerHTML='\n            <div class="content-card" style="text-align:center; padding:40px 20px;">\n                <i class="fas fa-microchip fa-3x" style="color:var(--color-accent); margin-bottom:15px"></i>\n                <p>MÓDULO CALIBRADO.<br><span style="opacity:0.6; font-size:0.8rem">Listo para recolección de datos biométricos.</span></p>\n            </div>'}function doPanic(){viewBody.innerHTML='\n            <div class="content-card" style="text-align:center; border-color: #ff4444;">\n                <i class="fas fa-exclamation-triangle fa-3x" style="color:#ff4444; margin-bottom:15px"></i>\n                <p>¿ACTIVAR PROTOCOLO DE PÁNICO?<br><small>Se enviará tu ubicación GPS a tus contactos de emergencia.</small></p>\n                <button class="btn-action" style="background:#ff4444; color:#fff; margin-top:20px;" onclick="alert(\'Ubicación enviada (Simulación)\')">ACTIVAR SOS</button>\n            </div>'}window.handleSearch=n=>{const e=window.app.tools.searchCalories(n);document.getElementById("results-area").innerHTML=e.map(n=>`\n            <div style="padding:12px; border-bottom:1px solid #222; display:flex; justify-content:space-between;">\n                <span>${n.n}</span>\n                <span style="color:var(--color-accent)">${n.c} kcal</span>\n            </div>\n        `).join("")},window.addEventListener("load",()=>{"serviceWorker"in navigator&&navigator.serviceWorker.register("sw.js").catch(n=>console.error("SW Error:",n)),setTimeout(()=>{document.getElementById("skeleton-loader").style.opacity="0",setTimeout(()=>{document.getElementById("skeleton-loader").style.display="none"},400)},800)}),window.onkeydown=n=>{"Escape"===n.key&&closeView()}</script></body></html>
